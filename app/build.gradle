// Configuración del módulo principal de la aplicación Android.
apply plugin: 'com.android.application'

android {

    // Versión del SDK utilizada para compilar el proyecto.
    compileSdkVersion 29
    buildToolsVersion "29.0.0"

    defaultConfig {
        // Identificador único de la aplicación.
        applicationId "in.myinnos.swiggyanimation"

        // Versiones mínima y objetivo de Android.
        minSdkVersion 19
        targetSdkVersion 29

        // Información de versión de la aplicación.
        versionCode 1
        versionName "1.0"
    }

    // Configuración de compilación para la versión de producción.
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    // Configura Java 8 para el código fuente del proyecto.
    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
}

// Librerías utilizadas por la interfaz y la aplicación.
dependencies {
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar']
    )

    // Dependencia para ejecutar pruebas unitarias locales con JUnit 4.
    testImplementation 'junit:junit:4.12'

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    // Librería utilizada para vincular las vistas mediante anotaciones.
    implementation 'com.jakewharton:butterknife:10.1.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.1.0'
}
